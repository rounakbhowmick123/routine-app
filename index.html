<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Schedule & Shifts</title>
  
  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#18181b" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        appDark: '#121214', appCard: '#1e1e24', appSurface: '#26262e', appBorder: '#2f2f3a'
      } } }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    #days-scroller {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }
    #days-scroller::-webkit-scrollbar { display: none; }
    .day-item { scroll-snap-align: center; flex: 0 0 44px; }
  </style>
</head>
<body class="bg-[#121214] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white">

  <!-- Hidden switch used for iOS haptic feedback -->
  <label id="haptic-label" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;">
    <input type="checkbox" switch id="haptic-switch" tabindex="-1" />
  </label>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-[#16161a]/95 backdrop-blur-md border-b border-appBorder px-3.5 pt-3.5 md:pt-4 pb-2.5">
    <div class="max-w-md lg:max-w-7xl mx-auto flex items-center justify-between gap-2">
      <!-- Title & Month -->
      <div class="min-w-0 flex-1">
        <p class="text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider text-purple-400" id="current-month-year">&nbsp;</p>
        <h1 class="text-lg sm:text-xl font-black tracking-tight text-white leading-tight">
          Daily Schedule
        </h1>
        <p id="sync-status" class="text-[9px] sm:text-[10px] text-slate-500 leading-none mt-0.5 truncate">Not synced yet</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-1.5 flex-shrink-0">
        <button id="today-btn" onclick="jumpToToday()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/40 text-[11px] sm:text-xs font-semibold active:scale-95 transition">&nbsp;</button>
        <button onclick="refreshData(true)" class="p-1.5 sm:p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Refresh">
          <svg id="refresh-icon" class="w-3.5 h-3.5 sm:w-4 sm:h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <button onclick="openSettings()" class="p-1.5 sm:p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Settings">
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MOBILE ONLY: HORIZONTAL SCROLLABLE DATE STRIP -->
  <section class="block lg:hidden bg-[#18181c] border-b border-appBorder py-2.5">
    <div class="max-w-md mx-auto">
      <div id="days-scroller" class="flex items-end gap-2 px-4 h-16"></div>
    </div>
  </section>

  <!-- LAPTOP ONLY: 5-DAY STRIP WITH FULL 5-DAY WINDOW JUMP ARROWS -->
  <section class="hidden lg:block bg-[#18181c] border-b border-appBorder py-3 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <button onclick="navigateWindow(-1)" aria-label="Previous 5 Days" class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Previous 5 Days">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
      </button>

      <div id="laptop-days-container" class="flex-1 grid grid-cols-5 gap-3"></div>

      <button onclick="navigateWindow(1)" aria-label="Next 5 Days" class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Next 5 Days">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="flex-1 w-full max-w-md lg:max-w-7xl mx-auto px-4 py-4 space-y-4">
    <!-- Selected Day Overview Info Card -->
    <section id="day-overview-card" class="bg-appCard border border-appBorder rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b border-appBorder/80">
        <div>
          <!-- Hidden on mobile to avoid duplicate weekday name, visible on lg+ -->
          <span id="selected-day-name" class="hidden lg:block text-xs uppercase font-extrabold tracking-wider text-purple-400">&nbsp;</span>
          <h2 id="selected-date-title" class="text-2xl font-black text-white">&nbsp;</h2>
        </div>
        <div id="shift-badge-container" class="text-right"></div>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 mt-3 pt-1 text-xs">
        <div id="meta-commute-card" class="bg-appSurface/60 rounded-xl p-2.5 border border-appBorder/50 transition-colors">
          <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Commute</span>
          <span id="meta-commute" class="font-bold text-slate-200">None</span>
        </div>
        <div class="bg-appSurface/60 rounded-xl p-2.5 border border-appBorder/50">
          <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Monitor Hours</span>
          <span id="meta-monitor" class="font-bold text-slate-200">-</span>
        </div>
        <div class="hidden lg:block bg-appSurface/60 rounded-xl p-2.5 border border-appBorder/50">
          <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Shift Window</span>
          <span id="meta-shift-window" class="font-bold text-slate-200">-</span>
        </div>
        <div class="hidden lg:block bg-appSurface/60 rounded-xl p-2.5 border border-appBorder/50">
          <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Total Activities</span>
          <span id="meta-activity-count" class="font-bold text-slate-200">-</span>
        </div>
      </div>
    </section>

    <!-- MOBILE ONLY: Single Day Activity Blocks -->
    <section class="block lg:hidden space-y-3">
      <div class="px-1">
        <h3 class="text-xs uppercase font-bold tracking-wider text-slate-400">Schedule</h3>
      </div>
      <div id="activity-blocks-container"></div>
    </section>

    <!-- LAPTOP ONLY: 5-Day Columns Multi-Date View -->
    <section class="hidden lg:block space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-sm uppercase font-bold tracking-wider text-purple-400">Date-Wise Schedule (5 Days)</h3>
        <span class="text-xs text-slate-400">Click any day header to select</span>
      </div>
      <div id="laptop-multi-day-container" class="grid grid-cols-5 gap-3"></div>
    </section>
  </main>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1e1e24] w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-appBorder space-y-4">
      <div class="flex justify-between items-center border-b border-appBorder pb-3">
        <h2 class="text-base font-bold text-white">Sheet API Connection</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-sm font-semibold">Done</button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Google Apps Script Web App URL</label>
        <input id="api-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs font-mono p-3 bg-appSurface text-white rounded-xl border border-appBorder focus:outline-none focus:ring-2 focus:ring-purple-500" />
        <p class="text-[11px] text-slate-400 mt-1.5">Paste your deployed Web App URL. The schedule then updates live from your sheet.</p>
      </div>
      <button onclick="saveApiUrl()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-xs active:scale-[0.98] transition shadow-md">Save & Sync</button>
    </div>
  </div>

  <script>
    // ---------- CONFIG ----------
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxZc7ILUfZzwLXYFdgfzR0blBDeRiLBJ3gk5gTJAcb3fm2fkBwtdDYbnGUXwmfsBkIs/exec';
    const AUTO_REFRESH_MS = 60 * 1000;
    const DAY_ITEM_STEP = 52;

    // ---------- STATE ----------
    let fullScheduleData = [];
    let selectedDayId = '';
    let laptopWindowIndex = 0;
    let lastPayload = '';
    let pollTimer = null;
    let stripInitialized = false;
    let lastTickIdx = -1;
    let suppressTick = false;

    const HOUR_SLOTS = [
      "12am - 1am", "1am - 2am", "2am - 3am", "3am - 4am", "4am - 5am", "5am - 6am",
      "6am - 7am", "7am - 8am", "8am - 9am", "9am - 10am", "10am - 11am", "11am - 12pm",
      "12pm - 1pm", "1pm - 2pm", "2pm - 3pm", "3pm - 4pm", "4pm - 5pm", "5pm - 6pm",
      "6pm - 7pm", "7pm - 8pm", "8pm - 9pm", "9pm - 10pm", "10pm - 11pm", "11pm - 12am"
    ];

    const ACTIVITY_THEMES = {
      sleep:    { name: 'Sleep',    dot: 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.7)]',         titleColor: 'text-rose-400',   rowBg: 'bg-rose-950/20 hover:bg-rose-950/30 border-rose-500/20', pillBg: 'bg-rose-500/10 border-rose-500/30 text-rose-200' },
      busy:     { name: 'Busy',     dot: 'bg-zinc-500 shadow-[0_0_8px_rgba(113,113,122,0.6)]',       titleColor: 'text-zinc-300',   rowBg: 'bg-zinc-900/80 hover:bg-zinc-900 border-zinc-700/60',     pillBg: 'bg-zinc-800 border-zinc-600/70 text-zinc-200' },
      music:    { name: 'Music',    dot: 'bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.7)]',       titleColor: 'text-amber-300',  rowBg: 'bg-amber-950/20 hover:bg-amber-950/30 border-amber-500/20', pillBg: 'bg-amber-500/10 border-amber-500/30 text-amber-200' },
      workout:  { name: 'Workout',  dot: 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.7)]',     titleColor: 'text-emerald-300',rowBg: 'bg-emerald-950/20 hover:bg-emerald-950/30 border-emerald-500/20', pillBg: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' },
      study:    { name: 'Study',    dot: 'bg-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.7)]',         titleColor: 'text-sky-300',    rowBg: 'bg-sky-950/20 hover:bg-sky-950/30 border-sky-500/20', pillBg: 'bg-sky-500/10 border-sky-500/30 text-sky-200' }
    };
    const DEFAULT_THEME = { dot: 'bg-purple-400 shadow-[0_0_8px_rgba(192,132,252,0.7)]', titleColor: 'text-purple-300', rowBg: 'bg-purple-950/20 hover:bg-purple-950/30 border-purple-500/20', pillBg: 'bg-purple-500/10 border-purple-500/30 text-purple-200' };

    function themeFor(key, rawName) {
      return ACTIVITY_THEMES[key] || { ...DEFAULT_THEME, name: rawName };
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function getApiUrl() {
      return localStorage.getItem('apps_script_url') || DEFAULT_API_URL;
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"],
            v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function updateTodayButton() {
      const btn = document.getElementById('today-btn');
      if (btn) {
        const now = new Date();
        const dateNum = now.getDate();
        const monthShort = now.toLocaleString('en-US', { month: 'short' });
        const weekday = now.toLocaleString('en-US', { weekday: 'long' });
        btn.textContent = `${getOrdinal(dateNum)}${monthShort},
