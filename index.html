<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Schedule & Shifts</title>
  
  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#18181b" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        appDark: '#121214', appCard: '#1e1e24', appSurface: '#26262e', appBorder: '#2f2f3a'
      } } }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    #days-scroller {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }
    #days-scroller::-webkit-scrollbar { display: none; }
    .day-item { scroll-snap-align: center; flex: 0 0 52px; }
  </style>
</head>
<body class="bg-[#121214] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white">

  <!-- Hidden switch used for iOS haptic feedback -->
  <label id="haptic-label" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;">
    <input type="checkbox" switch id="haptic-switch" tabindex="-1" />
  </label>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-[#16161a]/95 backdrop-blur-md border-b border-appBorder px-3.5 sm:px-6 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <!-- Month & Sync Status -->
      <div class="min-w-0 flex-1">
        <h1 class="text-base sm:text-xl font-black uppercase tracking-tight text-purple-400 leading-tight" id="current-month-year">&nbsp;</h1>
        <p id="sync-status" class="text-[9px] sm:text-[10px] text-slate-500 leading-none mt-1 truncate">Not synced yet</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-1.5 flex-shrink-0">
        <button id="today-btn" onclick="jumpToToday()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/40 text-[11px] sm:text-xs font-semibold active:scale-95 transition">&nbsp;</button>
        <button onclick="refreshData(true)" class="p-1.5 sm:p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Refresh">
          <svg id="refresh-icon" class="w-3.5 h-3.5 sm:w-4 sm:h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <button onclick="openSettings()" class="p-1.5 sm:p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Settings">
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- HORIZONTAL SCROLLABLE DATE STRIP (SHARED MOBILE & LAPTOP) -->
  <section class="bg-[#18181c] border-b border-appBorder py-2.5">
    <div class="max-w-4xl mx-auto">
      <div id="days-scroller" class="flex items-end gap-2 px-4 h-16 justify-start lg:justify-center"></div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="flex-1 w-full max-w-4xl mx-auto px-4 py-4 space-y-4">
    <!-- Selected Day Overview Info Card -->
    <section id="day-overview-card" class="bg-appCard border border-appBorder rounded-2xl p-4 sm:p-5 shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b border-appBorder/80">
        <div>
          <h2 id="selected-date-title" class="text-xl sm:text-2xl font-black text-white">&nbsp;</h2>
        </div>
        <div id="shift-badge-container" class="text-right"></div>
      </div>
      
      <!-- 3-Column Metrics: Commute, Monitor, and Free -->
      <div class="grid grid-cols-3 gap-2.5 mt-3 pt-1 text-xs">
        <div id="meta-commute-card" class="bg-appSurface/60 rounded-xl p-2.5 sm:p-3 border border-appBorder/50 transition-colors">
          <span class="text-[10px] sm:text-[11px] uppercase font-bold text-slate-400 block mb-0.5">Commute</span>
          <span id="meta-commute" class="font-bold text-slate-200 truncate block">None</span>
        </div>
        <div class="bg-appSurface/60 rounded-xl p-2.5 sm:p-3 border border-appBorder/50">
          <span class="text-[10px] sm:text-[11px] uppercase font-bold text-slate-400 block mb-0.5">Monitor</span>
          <span id="meta-monitor" class="font-bold text-slate-200 truncate block">0 hrs</span>
        </div>
        <div class="bg-appSurface/60 rounded-xl p-2.5 sm:p-3 border border-appBorder/50">
          <span class="text-[10px] sm:text-[11px] uppercase font-bold text-emerald-400 block mb-0.5">Free</span>
          <span id="meta-free" class="font-bold text-emerald-300 truncate block">24 hrs</span>
        </div>
      </div>
    </section>

    <!-- Activity Blocks Container -->
    <section class="space-y-3">
      <div class="px-1 flex items-center justify-between">
        <h3 class="text-xs uppercase font-bold tracking-wider text-slate-400">Schedule</h3>
      </div>
      <div id="activity-blocks-container"></div>
    </section>
  </main>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1e1e24] w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-appBorder space-y-4">
      <div class="flex justify-between items-center border-b border-appBorder pb-3">
        <h2 class="text-base font-bold text-white">Sheet API Connection</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-sm font-semibold">Done</button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Google Apps Script Web App URL</label>
        <input id="api-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs font-mono p-3 bg-appSurface text-white rounded-xl border border-appBorder focus:outline-none focus:ring-2 focus:ring-purple-500" />
        <p class="text-[11px] text-slate-400 mt-1.5">Paste your deployed Web App URL. The schedule then updates live from your sheet.</p>
      </div>
      <button onclick="saveApiUrl()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-xs active:scale-[0.98] transition shadow-md">Save & Sync</button>
    </div>
  </div>

  <script>
    // ---------- CONFIG ----------
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxZc7ILUfZzwLXYFdgfzR0blBDeRiLBJ3gk5gTJAcb3fm2fkBwtdDYbnGUXwmfsBkIs/exec';
    const AUTO_REFRESH_MS = 60 * 1000;
    const DAY_ITEM_STEP = 56;
    const DISPLAY_DAY_WINDOW = 18; // Optimal balanced count for scroller view

    // ---------- STATE ----------
    let fullScheduleData = [];
    let visibleScheduleData = [];
    let selectedDayId = '';
    let lastPayload = '';
    let pollTimer = null;
    let stripInitialized = false;
    let lastTickIdx = -1;
    let suppressTick = false;

    const HOUR_SLOTS = [
      "12am - 1am", "1am - 2am", "2am - 3am", "3am - 4am", "4am - 5am", "5am - 6am",
      "6am - 7am", "7am - 8am", "8am - 9am", "9am - 10am", "10am - 11am", "11am - 12pm",
      "12pm - 1pm", "1pm - 2pm", "2pm - 3pm", "3pm - 4pm", "4pm - 5pm", "5pm - 6pm",
      "6pm - 7pm", "7pm - 8pm", "8pm - 9pm", "9pm - 10pm", "10pm - 11pm", "11pm - 12am"
    ];

    const ACTIVITY_THEMES = {
      sleep:    { name: 'Sleep',    dot: 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.7)]',         titleColor: 'text-rose-400',   rowBg: 'bg-rose-950/20 hover:bg-rose-950/30 border-rose-500/20', pillBg: 'bg-rose-500/10 border-rose-500/30 text-rose-200' },
      busy:     { name: 'Busy',     dot: 'bg-zinc-500 shadow-[0_0_8px_rgba(113,113,122,0.6)]',       titleColor: 'text-zinc-300',   rowBg: 'bg-zinc-900/80 hover:bg-zinc-900 border-zinc-700/60',     pillBg: 'bg-zinc-800 border-zinc-600/70 text-zinc-200' },
      music:    { name: 'Music',    dot: 'bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.7)]',       titleColor: 'text-amber-300',  rowBg: 'bg-amber-950/20 hover:bg-amber-950/30 border-amber-500/20', pillBg: 'bg-amber-500/10 border-amber-500/30 text-amber-200' },
      workout:  { name: 'Workout',  dot: 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.7)]',     titleColor: 'text-emerald-300',rowBg: 'bg-emerald-950/20 hover:bg-emerald-950/30 border-emerald-500/20', pillBg: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' },
      study:    { name: 'Study',    dot: 'bg-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.7)]',         titleColor: 'text-sky-300',    rowBg: 'bg-sky-950/20 hover:bg-sky-950/30 border-sky-500/20', pillBg: 'bg-sky-500/10 border-sky-500/30 text-sky-200' }
    };
    const DEFAULT_THEME = { dot: 'bg-purple-400 shadow-[0_0_8px_rgba(192,132,252,0.7)]', titleColor: 'text-purple-300', rowBg: 'bg-purple-950/20 hover:bg-purple-950/30 border-purple-500/20', pillBg: 'bg-purple-500/10 border-purple-500/30 text-purple-200' };

    function themeFor(key, rawName) {
      return ACTIVITY_THEMES[key] || { ...DEFAULT_THEME, name: rawName };
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function getApiUrl() {
      return localStorage.getItem('apps_script_url') || DEFAULT_API_URL;
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"],
            v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function updateTodayButton() {
      const btn = document.getElementById('today-btn');
      if (btn) {
        const now = new Date();
        const dateNum = now.getDate();
        const monthShort = now.toLocaleString('en-US', { month: 'short' });
        const weekday = now.toLocaleString('en-US', { weekday: 'long' });
        btn.textContent = `${getOrdinal(dateNum)} ${monthShort}, ${weekday}`;
      }
    }

    function parseSheetMonthYear(sheetName) {
      if (!sheetName) return null;
      const cleaned = sheetName.replace(/[,\-_]/g, ' ').replace(/\s+/g, ' ').trim();
      const parts = cleaned.split(' ');
      if (parts.length >= 2) {
        const monthStr = parts[0];
        let yearNum = parseInt(parts[1], 10);
        if (yearNum < 100) yearNum += 2000;
        const d = new Date(`1 ${monthStr} ${yearNum}`);
        if (!isNaN(d.getTime())) {
          return { year: d.getFullYear(), month: d.getMonth() };
        }
      }
      return null;
    }

    // ---------- HAPTICS ----------
    function haptic() {
      try {
        if (navigator.vibrate) { navigator.vibrate(8); return; }
        document.getElementById('haptic-label').click();
      } catch (e) {}
    }

    // ---------- STARTUP ----------
    window.addEventListener('DOMContentLoaded', () => {
      const url = getApiUrl();
      document.getElementById('api-url-input').value = url;
      updateTodayButton();

      const scroller = document.getElementById('days-scroller');
      if (scroller) {
        scroller.addEventListener('scroll', () => {
          if (suppressTick) return;
          const idx = Math.round(scroller.scrollLeft / DAY_ITEM_STEP);
          if (idx !== lastTickIdx) {
            lastTickIdx = idx;
            haptic();
            if (visibleScheduleData[idx]) {
              const monthHeader = document.getElementById('current-month-year');
              if (monthHeader) {
                monthHeader.textContent = visibleScheduleData[idx]._fullMonthYear || visibleScheduleData[idx]._sheetName || '';
              }
            }
          }
        }, { passive: true });
      }

      try {
        const cached = JSON.parse(localStorage.getItem('schedule_cache') || 'null');
        if (cached && Array.isArray(cached.data) && cached.data.length) {
          applyData(cached.data);
          setStatus('Cached · ' + cached.time);
        }
      } catch (e) {}

      if (url) {
        fetchLiveData(url);
        startPolling();
      } else {
        renderDaySchedule();
        openSettings();
      }
    });

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (!document.hidden) refreshData(); }, AUTO_REFRESH_MS);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshData(); });
    window.addEventListener('focus', () => refreshData());
    window.addEventListener('online', () => refreshData());

    function setStatus(text, isError) {
      const el = document.getElementById('sync-status');
      el.textContent = text;
      el.className = 'text-[9px] sm:text-[10px] leading-none mt-1 truncate ' + (isError ? 'text-rose-400' : 'text-slate-500');
    }

    // ---------- DATA PROCESSING ----------
    function processDataset(rawJson) {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetMonth = now.getMonth();

      const prevRowsRaw = rawJson.filter(r => r._isPrevMonth === true);
      const currRowsRaw = rawJson.filter(r => !r._isPrevMonth);

      const currSample = currRowsRaw[0] || rawJson[rawJson.length - 1];
      if (currSample && currSample._sheetName) {
        const parsed = parseSheetMonthYear(currSample._sheetName);
        if (parsed) {
          targetYear = parsed.year;
          targetMonth = parsed.month;
        }
      }

      let prevYear = targetYear;
      let prevMonth = targetMonth - 1;
      if (prevMonth < 0) {
        prevMonth = 11;
        prevYear -= 1;
      }
      if (prevRowsRaw.length > 0 && prevRowsRaw[0]._sheetName) {
        const parsed = parseSheetMonthYear(prevRowsRaw[0]._sheetName);
        if (parsed) {
          prevYear = parsed.year;
          prevMonth = parsed.month;
        }
      }

      const pad = n => String(n).padStart(2, '0');
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      let trimmedPrev = [];
      if (prevRowsRaw.length > 0) {
        trimmedPrev = prevRowsRaw.slice(-8).map(item => {
          const d = parseInt(item.date, 10);
          const dObj = new Date(prevYear, prevMonth, d);
          return {
            ...item,
            _id: `${prevYear}-${pad(prevMonth + 1)}-${pad(d)}`,
            _monthLabel: dObj.toLocaleString('en-US', { month: 'short' }),
            _fullMonthYear: dObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }),
            _isPrevMonth: true,
            date: d,
            day: item.day || dayNames[dObj.getDay()]
          };
        });
      } else {
        const prevMonthLastDate = new Date(targetYear, targetMonth, 0);
        const lastDayNum = prevMonthLastDate.getDate();
        const startDay = Math.max(1, lastDayNum - 7);

        for (let dayNum = startDay; dayNum <= lastDayNum; dayNum++) {
          const id = `${prevYear}-${pad(prevMonth + 1)}-${pad(dayNum)}`;
          const dObj = new Date(prevYear, prevMonth, dayNum);
          trimmedPrev.push({
            _id: id,
            date: dayNum,
            day: dayNames[dObj.getDay()],
            _isPrevMonth: true,
            _monthLabel: dObj.toLocaleString('en-US', { month: 'short' }),
            _fullMonthYear: dObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }),
            _sheetName: dObj.toLocaleString('en-US', { month: 'short', year: '2-digit' }),
            commute: 'None',
            shift: '',
            monitor_hours: '0 hrs',
            schedule: {}
          });
        }
      }

      const mappedCurr = currRowsRaw.map(item => {
        const d = parseInt(item.date, 10);
        const dObj = new Date(targetYear, targetMonth, d);
        return {
          ...item,
          _id: `${targetYear}-${pad(targetMonth + 1)}-${pad(d)}`,
          _monthLabel: dObj.toLocaleString('en-US', { month: 'short' }),
          _fullMonthYear: dObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }),
          _isPrevMonth: false,
          date: d,
          day: item.day || dayNames[dObj.getDay()]
        };
      });

      return [...trimmedPrev, ...mappedCurr];
    }

    function calculateFreeHours(schedule) {
      if (!schedule) return 24;
      let busyCount = 0;
      for (let i = 0; i < HOUR_SLOTS.length; i++) {
        const val = String(schedule[HOUR_SLOTS[i]] || '').trim().toLowerCase();
        if (val && val !== 'free') {
          busyCount++;
        }
      }
      return Math.max(0, 24 - busyCount);
    }

    function getTodayId() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    function computeVisibleWindow() {
      if (fullScheduleData.length <= DISPLAY_DAY_WINDOW) {
        visibleScheduleData = [...fullScheduleData];
        return;
      }

      const selIdx = fullScheduleData.findIndex(r => r._id === selectedDayId);
      let targetIdx = selIdx !== -1 ? selIdx : 0;

      let start = Math.max(0, targetIdx - Math.floor(DISPLAY_DAY_WINDOW / 2));
      let end = start + DISPLAY_DAY_WINDOW;

      if (end > fullScheduleData.length) {
        end = fullScheduleData.length;
        start = Math.max(0, end - DISPLAY_DAY_WINDOW);
      }

      visibleScheduleData = fullScheduleData.slice(start, end);
    }

    function selectDateById(id) {
      selectedDayId = id;
      haptic();
      updateStripSelection();
      renderDaySchedule();
    }

    function jumpToToday() {
      const todayId = getTodayId();
      const exists = fullScheduleData.some(r => r._id === todayId);
      if (exists) {
        selectedDayId = todayId;
      } else if (fullScheduleData.length) {
        const firstCurrent = fullScheduleData.find(r => !r._isPrevMonth);
        selectedDayId = firstCurrent ? firstCurrent._id : fullScheduleData[0]._id;
      }

      computeVisibleWindow();
      haptic();
      buildStrip();
      scrollSelectedIntoView();
      renderDaySchedule();
    }

    function applyData(json) {
      fullScheduleData = processDataset(json);

      updateTodayButton();

      const todayId = getTodayId();
      if (!selectedDayId || !fullScheduleData.some(r => r._id === selectedDayId)) {
        const hasToday = fullScheduleData.some(r => r._id === todayId);
        selectedDayId = hasToday ? todayId : (fullScheduleData.find(r => !r._isPrevMonth) || fullScheduleData[0])._id;
      }

      computeVisibleWindow();
      buildStrip();
      renderDaySchedule();

      if (!stripInitialized) {
        scrollSelectedIntoView();
        stripInitialized = true;
      }
    }

    async function fetchLiveData(url) {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('rotate-180');
      try {
        const cacheBuster = (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
        const response = await fetch(url + cacheBuster, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const text = await response.text();
        const json = JSON.parse(text);
        if (!Array.isArray(json)) throw new Error('Unexpected response');
        if (json.length === 0) throw new Error('Sheet returned no rows');

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setStatus('Synced · ' + time);
        if (text !== lastPayload) {
          lastPayload = text;
          applyData(json);
          try { localStorage.setItem('schedule_cache', JSON.stringify({ data: json, time })); } catch (e) {}
        }
      } catch (err) {
        console.warn('Sync failed:', err);
        setStatus('Sync failed · showing last data', true);
      } finally {
        if (icon) setTimeout(() => icon.classList.remove('rotate-180'), 500);
      }
    }

    function refreshData(manual) {
      const url = getApiUrl();
      if (url) fetchLiveData(url);
      else if (manual) openSettings();
    }

    function hasCabFor(rec) {
      return !!(rec && rec.commute && rec.commute.trim().toUpperCase().includes('CAB'));
    }

    function isWoShift(rec) {
      return !!(rec && rec.shift && rec.shift.trim().toUpperCase() === 'WO');
    }

    function dayCircleClasses(selected, cab, isToday) {
      let c = 'w-9 h-9 rounded-full flex flex-col items-center justify-center transition-all duration-200 ';
      
      if (selected) {
        c += 'bg-purple-600 text-white ring-4 ring-purple-500/30 scale-105 shadow-lg shadow-purple-600/30';
        if (isToday) c += ' border-2 border-purple-300';
      } else if (isToday) {
        c += 'bg-appSurface text-purple-300 border-2 border-purple-400 ring-2 ring-purple-500/20';
        if (cab) c += ' text-amber-300 border-amber-400';
      } else if (cab) {
        c += 'bg-amber-500/20 text-amber-300 border-2 border-amber-400 ring-2 ring-amber-400/20';
      } else {
        c += 'bg-appSurface text-slate-300 border border-appBorder hover:border-slate-500';
      }
      return c;
    }

    function buildStrip() {
      const scroller = document.getElementById('days-scroller');
      const todayId = getTodayId();
      if (scroller) {
        const keep = scroller.scrollLeft;
        suppressTick = true;
        scroller.innerHTML = '';

        visibleScheduleData.forEach(rec => {
          const cab = hasCabFor(rec);
          const isWo = isWoShift(rec);
          const selected = rec._id === selectedDayId;
          const isToday = rec._id === todayId;

          const btn = document.createElement('button');
          btn.className = 'day-item flex flex-col items-center justify-end py-1 rounded-xl active:scale-95 transition h-full';
          btn.dataset.id = rec._id;
          btn.onclick = () => selectDateById(rec._id);
          btn.innerHTML = `
            <span class="day-label text-[9px] uppercase font-bold tracking-tight mb-1 ${
              selected ? 'text-purple-400' : isToday ? 'text-purple-300' : rec._isPrevMonth ? 'text-slate-500' : 'text-slate-400'
            }">${esc((rec.day || '').slice(0, 3))}</span>
            <div class="day-circle ${dayCircleClasses(selected, cab, isToday)}">
              <span class="text-[11px] font-bold leading-none">${rec.date}</span>
              ${cab ? '<span class="text-[6px] font-black uppercase text-amber-300 leading-none mt-0.5">CAB</span>' : ''}
            </div>
            <div class="h-2 flex items-center justify-center mt-1.5">
              ${isWo ? '<span class="w-1.5 h-1.5 rounded-full bg-rose-500 shadow-[0_0_6px_rgba(244,63,94,0.8)]"></span>' : ''}
            </div>`;
          scroller.appendChild(btn);
        });

        scroller.scrollLeft = keep;
        lastTickIdx = Math.round(scroller.scrollLeft / DAY_ITEM_STEP);
        setTimeout(() => { suppressTick = false; }, 150);
      }
    }

    function updateStripSelection() {
      const todayId = getTodayId();
      document.querySelectorAll('#days-scroller .day-item').forEach(btn => {
        const id = btn.dataset.id;
        const rec = visibleScheduleData.find(r => r._id === id);
        const cab = rec ? hasCabFor(rec) : false;
        const selected = id === selectedDayId;
        const isToday = id === todayId;
        const isPrev = rec ? rec._isPrevMonth : false;

        btn.querySelector('.day-circle').className = 'day-circle ' + dayCircleClasses(selected, cab, isToday);
        btn.querySelector('.day-label').className = 'day-label text-[9px] uppercase font-bold tracking-tight mb-1 ' + (
          selected ? 'text-purple-400' : isToday ? 'text-purple-300' : isPrev ? 'text-slate-500' : 'text-slate-400'
        );
      });
    }

    function scrollSelectedIntoView() {
      const scroller = document.getElementById('days-scroller');
      if (!scroller) return;
      const btn = scroller.querySelector(`[data-id="${selectedDayId}"]`);
      if (!btn) return;
      suppressTick = true;
      scroller.scrollTo({ left: btn.offsetLeft - (scroller.clientWidth - btn.offsetWidth) / 2, behavior: 'smooth' });
      setTimeout(() => {
        lastTickIdx = Math.round(scroller.scrollLeft / DAY_ITEM_STEP);
        suppressTick = false;
      }, 600);
    }

    // ---------- DAY DETAILS ----------
    function renderDaySchedule() {
      const container = document.getElementById('activity-blocks-container');
      const rec = fullScheduleData.find(i => i._id === selectedDayId);

      if (!rec) {
        if (container) {
          container.innerHTML = `
            <div class="p-8 text-center text-slate-400 bg-appCard rounded-2xl border border-appBorder">
              <p class="text-sm font-semibold">${getApiUrl() ? 'Waiting for data…' : 'Not connected'}</p>
              <p class="text-xs text-slate-500 mt-1">${getApiUrl() ? 'Tap the refresh button to retry.' : 'Tap the gear icon and paste your Apps Script URL.'}</p>
            </div>`;
        }
        return;
      }

      const monthHeader = document.getElementById('current-month-year');
      if (monthHeader) {
        monthHeader.textContent = rec._fullMonthYear || rec._sheetName || '';
      }

      // Title shows Day, Month and Date cleanly without repeated colored text
      document.getElementById('selected-date-title').textContent = `${rec.day}, ${rec._monthLabel || ''} ${rec.date}`;
      document.getElementById('meta-commute').textContent = rec.commute || 'None';
      document.getElementById('meta-monitor').textContent = rec.monitor_hours || '0 hrs';

      // Calculate and display Free hours
      const freeHours = calculateFreeHours(rec.schedule || {});
      const freeElem = document.getElementById('meta-free');
      if (freeElem) freeElem.textContent = `${freeHours} hrs`;

      const isCab = hasCabFor(rec);
      const commuteCard = document.getElementById('meta-commute-card');
      if (commuteCard) {
        if (isCab) {
          commuteCard.className = 'bg-amber-500/10 rounded-xl p-2.5 sm:p-3 border-2 border-amber-400 ring-2 ring-amber-400/20 text-amber-300 transition-colors';
          document.getElementById('meta-commute').className = 'font-bold text-amber-300 truncate block';
        } else {
          commuteCard.className = 'bg-appSurface/60 rounded-xl p-2.5 sm:p-3 border border-appBorder/50 text-slate-200 transition-colors';
          document.getElementById('meta-commute').className = 'font-bold text-slate-200 truncate block';
        }
      }

      const s = rec.shift;
      const shiftColor = !s ? '' : s.startsWith('M') ? 'bg-emerald-600 text-white' : s === 'WO' ? 'bg-rose-600 text-white' : s.startsWith('A') ? 'bg-blue-600 text-white' : s.startsWith('N') ? 'bg-slate-500 text-white' : 'bg-purple-500/20 text-purple-300';
      document.getElementById('shift-badge-container').innerHTML = s
        ? `<span class="px-2.5 py-1 rounded-full text-xs font-black shadow-sm ${shiftColor}">Shift: ${esc(s)}</span>`
        : `<span class="text-xs text-slate-500">No Shift</span>`;

      const rows = buildTimeline(rec.schedule || {});

      if (!container) return;

      if (rows.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-slate-500 bg-appCard rounded-2xl border border-appBorder text-xs font-semibold">
            No scheduled activities
          </div>`;
        return;
      }

      const body = rows.map(r => {
        const t = themeFor(r.key, r.label);
        return `
          <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl border ${t.rowBg} transition-all duration-150">
            <div class="flex items-center space-x-2.5">
              <span class="w-2.5 h-2.5 rounded-full ${t.dot}"></span>
              <span class="text-sm font-bold tracking-wide ${t.titleColor}">${esc(t.name)}</span>
            </div>
            <div class="flex items-center space-x-2 px-2.5 py-1 rounded-lg border ${t.pillBg}">
              <span class="text-xs font-black tracking-wide">${esc(r.start)} – ${esc(r.end)}</span>
              <span class="text-[10px] font-bold opacity-75">(${r.duration}h)</span>
            </div>
          </div>`;
      }).join('');

      container.innerHTML = `
        <div class="rounded-2xl border border-appBorder bg-appCard p-2.5 space-y-1.5 shadow-sm">
          ${body}
        </div>`;
    }

    function buildTimeline(schedule) {
      const rows = [];
      let cur = null, curLabel = '', startIdx = 0;

      const flush = endIdx => {
        if (!cur) return;
        rows.push({
          key: cur,
          label: curLabel,
          start: HOUR_SLOTS[startIdx].split(' - ')[0],
          end: HOUR_SLOTS[endIdx].split(' - ')[1],
          duration: endIdx - startIdx + 1
        });
      };

      for (let i = 0; i < HOUR_SLOTS.length; i++) {
        let label = String(schedule[HOUR_SLOTS[i]] || '').trim();
        const key = label.toLowerCase();

        if (!label || key === 'free') {
          flush(i - 1);
          cur = null;
          curLabel = '';
          continue;
        }

        if (key !== cur) {
          flush(i - 1);
          cur = key;
          curLabel = label;
          startIdx = i;
        }
      }
      flush(HOUR_SLOTS.length - 1);
      return rows;
    }

    // ---------- SETTINGS ----------
    function openSettings() {
      const m = document.getElementById('settings-modal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }
    function closeSettings() {
      const m = document.getElementById('settings-modal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    function saveApiUrl() {
      const val = document.getElementById('api-url-input').value.trim();
      if (val) {
        localStorage.setItem('apps_script_url', val);
        lastPayload = '';
        fetchLiveData(val);
        startPolling();
      } else {
        localStorage.removeItem('apps_script_url');
        clearInterval(pollTimer);
      }
      closeSettings();
    }
  </script>
</body>
