<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Schedule & Shifts</title>

  <!-- iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#18181b" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appDark: '#121214',
            appCard: '#1e1e24',
            appSurface: '#26262e',
            appBorder: '#2f2f3a',
            lavender: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              800: '#4c1d95',
              900: '#2e1065',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#121214] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white">

  <!-- TOP HEADER: MONTH, YEAR & CONTROLS -->
  <header class="sticky top-0 z-30 bg-[#16161a]/90 backdrop-blur-md border-b border-appBorder px-4 pt-10 pb-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-purple-400" id="current-month-year">October 2026</p>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          Daily Schedule
          <span id="cab-status-pill" class="hidden text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">CAB Day</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="jumpToToday()" class="px-3 py-1.5 rounded-full bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/40 text-xs font-semibold active:scale-95 transition">
          Today
        </button>
        <button onclick="refreshData()" class="p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Refresh">
          <svg id="refresh-icon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.3
