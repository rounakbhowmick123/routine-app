<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Schedule & Shifts</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#18181b" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        appDark: '#121214', appCard: '#1e1e24', appSurface: '#26262e', appBorder: '#2f2f3a'
      } } }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body class="bg-[#121214] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white">

  <header class="sticky top-0 z-30 bg-[#16161a]/90 backdrop-blur-md border-b border-appBorder px-4 pt-10 pb-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-purple-400" id="current-month-year">&nbsp;</p>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          Daily Schedule
          <span id="cab-status-pill" class="hidden text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">CAB Day</span>
        </h1>
        <p id="sync-status" class="text-[10px] text-slate-500 mt-0.5">Not synced yet</p>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="jumpToToday()" class="px-3 py-1.5 rounded-full bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/40 text-xs font-semibold active:scale-95 transition">Today</button>
        <button onclick="refreshData(true)" class="p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Refresh">
          <svg id="refresh-icon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <button onclick="openSettings()" class="p-2 rounded-full bg-appSurface hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="Settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <section class="bg-[#18181c] border-b border-appBorder py-3 px-2">
    <div class="max-w-md mx-auto flex items-center justify-between gap-1">
      <button onclick="navigateDays(-1)" aria-label="Previous Day" class="w-8 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-appSurface/80 hover:bg-appSurface text-slate-300 active:scale-90 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
      </button>
      <div id="seven-days-container" class="flex-1 grid grid-cols-7 gap-1"></div>
      <button onclick="navigateDays(1)" aria-label="Next Day" class="w-8 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-appSurface/80 hover:bg-appSurface text-slate-300 active:scale-90 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
    <div class="max-w-md mx-auto mt-2 px-3 flex items-center justify-between text-[11px] text-slate-400">
      <div class="flex items-center space-x-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 ring-2 ring-amber-400/30"></span>
        <span>Amber Ring / Fill = CAB Commute</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
        <span>Active Selected</span>
      </div>
    </div>
  </section>

  <main class="flex-1 max-w-md mx-auto w-full px-4 py-4 space-y-4">
    <section id="day-overview-card" class="bg-appCard border border-appBorder rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b border-appBorder/80">
        <div>
          <span id="selected-day-name" class="text-xs uppercase font-extrabold tracking-wider text-purple-400">&nbsp;</span>
          <h2 id="selected-date-title" class="text-2xl font-black text-white">&nbsp;</h2>
        </div>
        <div id="shift-badge-container" class="text-right"></div>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3 pt-1 text-xs">
        <div class="bg-appSurface/60 rounded-xl p-2.5 border border-appBorder/50">
          <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Commute</span>
          <span id="meta-commute" class="font-bold text-slate-200">None</span>
        </div>
        <div class="bg-appSurface/60 rounded-xl p-2.5 border border-appBorder/50">
          <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Monitor Hours</span>
          <span id="meta-monitor" class="font-bold text-slate-200">-</span>
        </div>
      </div>
    </section>

    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs uppercase font-bold tracking-wider text-slate-400">Activity Time Windows</h3>
        <span class="text-[11px] text-slate-500">Grouped sessions</span>
      </div>
      <div id="activity-blocks-container" class="space-y-3"></div>
    </section>
  </main>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1e1e24] w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-appBorder space-y-4">
      <div class="flex justify-between items-center border-b border-appBorder pb-3">
        <h2 class="text-base font-bold text-white">Sheet API Connection</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-sm font-semibold">Done</button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Google Apps Script Web App URL</label>
        <input id="api-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs font-mono p-3 bg-appSurface text-white rounded-xl border border-appBorder focus:outline-none focus:ring-2 focus:ring-purple-500" />
        <p class="text-[11px] text-slate-400 mt-1.5">Paste your deployed Web App URL. The schedule then updates live from your sheet.</p>
      </div>
      <button onclick="saveApiUrl()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-xs active:scale-[0.98] transition shadow-md">Save & Sync</button>
    </div>
  </div>

  <script>
    // ---------- CONFIG ----------
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxZc7ILUfZzwLXYFdgfzR0blBDeRiLBJ3gk5gTJAcb3fm2fkBwtdDYbnGUXwmfsBkIs/exec';
    const AUTO_REFRESH_MS = 60 * 1000; // poll every 60s while the page is visible

    // ---------- STATE ----------
    let fullScheduleData = [];
    let selectedDateNumber = new Date().getDate();
    let lastPayload = '';
    let pollTimer = null;

    const HOUR_SLOTS = [
      "12am - 1am", "1am - 2am", "2am - 3am", "3am - 4am", "4am - 5am", "5am - 6am",
      "6am - 7am", "7am - 8am", "8am - 9am", "9am - 10am", "10am - 11am", "11am - 12pm",
      "12pm - 1pm", "1pm - 2pm", "2pm - 3pm", "3pm - 4pm", "4pm - 5pm", "5pm - 6pm",
      "6pm - 7pm", "7pm - 8pm", "8pm - 9pm", "9pm - 10pm", "10pm - 11pm", "11pm - 12am"
    ];

    const ACTIVITY_THEMES = {
      sleep:   { name: 'Sleep',   cardBg: 'bg-indigo-950/40 border-indigo-500/30 text-indigo-200',   badgeBg: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40',   dot: 'bg-indigo-400',  titleColor: 'text-indigo-300' },
      busy:    { name: 'Busy',    cardBg: 'bg-slate-800/60 border-slate-600/40 text-slate-200',      badgeBg: 'bg-slate-700/60 text-slate-300 border-slate-600/60',      dot: 'bg-slate-400',   titleColor: 'text-slate-300' },
      music:   { name: 'Music',   cardBg: 'bg-amber-950/40 border-amber-500/30 text-amber-200',      badgeBg: 'bg-amber-500/20 text-amber-300 border-amber-500/40',      dot: 'bg-amber-400',   titleColor: 'text-amber-300' },
      workout: { name: 'Workout', cardBg: 'bg-emerald-950/40 border-emerald-500/30 text-emerald-200', badgeBg: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40', dot: 'bg-emerald-400', titleColor: 'text-emerald-300' },
      study:   { name: 'Study',   cardBg: 'bg-sky-950/40 border-sky-500/30 text-sky-200',            badgeBg: 'bg-sky-500/20 text-sky-300 border-sky-500/40',            dot: 'bg-sky-400',     titleColor: 'text-sky-300' }
    };
    const DEFAULT_THEME = { cardBg: 'bg-purple-950/40 border-purple-500/30 text-purple-200', badgeBg: 'bg-purple-500/20 text-purple-300 border-purple-500/40', dot: 'bg-purple-400', titleColor: 'text-purple-300' };
    const KNOWN_ORDER = ['sleep', 'busy', 'workout', 'study', 'music'];

    function themeFor(key, rawName) {
      return ACTIVITY_THEMES[key] || { ...DEFAULT_THEME, name: rawName };
    }

    function getApiUrl() {
      return localStorage.getItem('apps_script_url') || DEFAULT_API_URL;
    }

    // ---------- STARTUP ----------
    window.addEventListener('DOMContentLoaded', () => {
      const url = getApiUrl();
      document.getElementById('api-url-input').value = url;

      // Show last known data instantly (works offline), then fetch fresh
      try {
        const cached = JSON.parse(localStorage.getItem('schedule_cache') || 'null');
        if (cached && Array.isArray(cached.data) && cached.data.length) {
          applyData(cached.data);
          setStatus('Cached · ' + cached.time);
        }
      } catch (e) {}

      if (url) {
        fetchLiveData(url);
        startPolling();
      } else {
        renderApp();
        openSettings();
      }
    });

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (!document.hidden) refreshData(); }, AUTO_REFRESH_MS);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshData(); });
    window.addEventListener('focus', () => refreshData());
    window.addEventListener('online', () => refreshData());

    function setStatus(text, isError) {
      const el = document.getElementById('sync-status');
      el.textContent = text;
      el.className = 'text-[10px] mt-0.5 ' + (isError ? 'text-rose-400' : 'text-slate-500');
    }

    // ---------- NAVIGATION ----------
    function maxDate() {
      return fullScheduleData.reduce((m, r) => Math.max(m, parseInt(r.date, 10) || 0), 0);
    }
    function hasDate(d) { return fullScheduleData.some(r => parseInt(r.date, 10) === d); }

    function jumpToToday() {
      const today = new Date().getDate();
      selectedDateNumber = hasDate(today) ? today : (fullScheduleData.length ? parseInt(fullScheduleData[0].date, 10) : 1);
      renderApp();
    }
    function navigateDays(delta) {
      const target = selectedDateNumber + delta;
      if (hasDate(target)) { selectedDateNumber = target; renderApp(); }
    }
    function selectDate(n) { selectedDateNumber = n; renderApp(); }

    // ---------- DATA ----------
    function applyData(json) {
      fullScheduleData = json;
      if (json[0] && json[0]._sheetName) {
        document.getElementById('current-month-year').textContent = json[0]._sheetName;
      } else {
        const now = new Date();
        document.getElementById('current-month-year').textContent =
          now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      }
      if (!hasDate(selectedDateNumber)) {
        const today = new Date().getDate();
        selectedDateNumber = hasDate(today) ? today : parseInt(json[0].date, 10);
      }
      renderApp();
    }

    async function fetchLiveData(url) {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('rotate-180');
      try {
        const cacheBuster = (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
        const response = await fetch(url + cacheBuster, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const text = await response.text();
        const json = JSON.parse(text);
        if (!Array.isArray(json)) throw new Error('Unexpected response');
        if (json.length === 0) throw new Error('Sheet returned no rows');

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setStatus('Synced · ' + time);
        // Only re-render if something actually changed
        if (text !== lastPayload) {
          lastPayload = text;
          applyData(json);
          try { localStorage.setItem('schedule_cache', JSON.stringify({ data: json, time })); } catch (e) {}
        }
      } catch (err) {
        console.warn('Sync failed:', err);
        setStatus('Sync failed · showing last data', true);
      } finally {
        if (icon) setTimeout(() => icon.classList.remove('rotate-180'), 500);
      }
    }

    function refreshData(manual) {
      const url = getApiUrl();
      if (url) fetchLiveData(url);
      else if (manual) openSettings();
    }

    // ---------- RENDER ----------
    function renderApp() {
      renderSevenDaysStrip();
      renderDaySchedule();
    }

    function renderSevenDaysStrip() {
      const container = document.getElementById('seven-days-container');
      container.innerHTML = '';
      if (!fullScheduleData.length) return;

      const totalDays = maxDate();
      let start = selectedDateNumber - 3;
      let end = selectedDateNumber + 3;
      if (start < 1) { start = 1; end = Math.min(7, totalDays); }
      else if (end > totalDays) { end = totalDays; start = Math.max(1, totalDays - 6); }

      for (let d = start; d <= end; d++) {
        const rec = fullScheduleData.find(i => parseInt(i.date, 10) === d);
        if (!rec) continue;

        const isSelected = d === selectedDateNumber;
        const hasCab = rec.commute && rec.commute.trim().toUpperCase().includes('CAB');
        const shortDay = (rec.day || '').slice(0, 3);

        let circle = 'w-10 h-10 rounded-full flex flex-col items-center justify-center transition-all duration-200 ';
        if (isSelected) circle += 'bg-purple-600 text-white ring-4 ring-purple-500/30 scale-105 shadow-lg shadow-purple-600/30';
        else if (hasCab) circle += 'bg-amber-500/20 text-amber-300 border-2 border-amber-400 ring-2 ring-amber-400/20';
        else circle += 'bg-appSurface text-slate-300 border border-appBorder hover:border-slate-500';

        const btn = document.createElement('button');
        btn.className = 'flex flex-col items-center py-1 rounded-xl active:scale-95 transition';
        btn.onclick = () => selectDate(d);
        btn.innerHTML = `
          <span class="text-[9px] uppercase font-bold tracking-tight mb-1 ${isSelected ? 'text-purple-400' : 'text-slate-400'}">${shortDay}</span>
          <div class="${circle}">
            <span class="text-xs font-bold leading-none">${d}</span>
            ${hasCab ? '<span class="text-[7px] font-black uppercase text-amber-300 leading-none">CAB</span>' : ''}
          </div>`;
        container.appendChild(btn);
      }
    }

    function renderDaySchedule() {
      const container = document.getElementById('activity-blocks-container');
      const rec = fullScheduleData.find(i => parseInt(i.date, 10) === selectedDateNumber);

      if (!rec) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-400 bg-appCard rounded-2xl border border-appBorder">
            <p class="text-sm font-semibold">${getApiUrl() ? 'Waiting for data…' : 'Not connected'}</p>
            <p class="text-xs text-slate-500 mt-1">${getApiUrl() ? 'Tap the refresh button to retry.' : 'Tap the gear icon and paste your Apps Script URL.'}</p>
          </div>`;
        return;
      }

      document.getElementById('selected-day-name').textContent = rec.day;
      document.getElementById('selected-date-title').textContent = `${rec.day}, Date ${rec.date}`;
      document.getElementById('meta-commute').textContent = rec.commute || 'None';
      document.getElementById('meta-monitor').textContent = rec.monitor_hours || '0 hrs';

      const hasCab = rec.commute && rec.commute.trim().toUpperCase().includes('CAB');
      document.getElementById('cab-status-pill').classList.toggle('hidden', !hasCab);

      const s = rec.shift;
      const shiftColor = !s ? '' : s.startsWith('M') ? 'bg-emerald-600 text-white' : s === 'WO' ? 'bg-rose-600 text-white' : s.startsWith('A') ? 'bg-blue-600 text-white' : s.startsWith('N') ? 'bg-slate-500 text-white' : 'bg-purple-500/20 text-purple-300';
      document.getElementById('shift-badge-container').innerHTML = s
        ? `<span class="px-2.5 py-1 rounded-full text-xs font-black shadow-sm ${shiftColor}">Shift: ${s}</span>`
        : `<span class="text-xs text-slate-500">No Shift</span>`;

      const windows = groupScheduleIntoWindows(rec.schedule || {});
      container.innerHTML = '';

      // Known activities first (fixed order), then any new ones you add in the sheet
      const keys = Object.keys(windows).sort((a, b) => {
        const ia = KNOWN_ORDER.indexOf(a), ib = KNOWN_ORDER.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });

      keys.forEach(key => {
        const list = windows[key].items;
        const theme = themeFor(key, windows[key].label);
        const total = list.reduce((a, c) => a + c.duration, 0);

        const pills = list.map((w, idx) => `
          <div class="flex-1 min-w-[130px] rounded-xl border p-2.5 ${theme.badgeBg} flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px] font-semibold text-slate-300 mb-1">
              <span>Window ${idx + 1}</span>
              <span class="text-[10px] font-bold opacity-80">${w.duration} hr${w.duration > 1 ? 's' : ''}</span>
            </div>
            <div class="text-sm font-black text-white tracking-wide">
              ${w.startLabel} <span class="text-xs font-normal opacity-70">to</span> ${w.endLabel}
            </div>
          </div>`).join('');

        const row = document.createElement('div');
        row.className = `rounded-2xl border p-3.5 ${theme.cardBg} transition-all shadow-sm`;
        row.innerHTML = `
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-white/10">
            <div class="flex items-center space-x-2">
              <span class="w-2.5 h-2.5 rounded-full ${theme.dot}"></span>
              <h4 class="text-sm font-bold uppercase tracking-wider ${theme.titleColor}"></h4>
            </div>
            <span class="text-xs font-extrabold px-2 py-0.5 rounded-full bg-black/30 border border-white/10 text-white">Total: ${total} hrs</span>
          </div>
          <div class="flex flex-wrap gap-2.5 mt-1">${pills}</div>`;
        row.querySelector('h4').textContent = theme.name;
        container.appendChild(row);
      });

      if (!container.children.length) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-400 bg-appCard rounded-2xl border border-appBorder">
            <p class="text-sm font-semibold">No scheduled activity</p>
            <p class="text-xs text-slate-500 mt-1">This day is completely free.</p>
          </div>`;
      }
    }

    // Combine consecutive identical hourly slots into windows
    function groupScheduleIntoWindows(schedule) {
      const grouped = {};
      let cur = null, curLabel = '', startIdx = 0;

      const flush = endIdx => {
        if (!cur) return;
        if (!grouped[cur]) grouped[cur] = { label: curLabel, items: [] };
        grouped[cur].items.push({
          startLabel: HOUR_SLOTS[startIdx].split(' - ')[0],
          endLabel: HOUR_SLOTS[endIdx].split(' - ')[1],
          duration: endIdx - startIdx + 1
        });
      };

      for (let i = 0; i < HOUR_SLOTS.length; i++) {
        const label = String(schedule[HOUR_SLOTS[i]] || '').trim();
        const key = label.toLowerCase();
        if (key !== cur) {
          flush(i - 1);
          cur = key; curLabel = label; startIdx = i;
        }
      }
      flush(HOUR_SLOTS.length - 1);
      return grouped;
    }

    // ---------- SETTINGS ----------
    function openSettings() {
      const m = document.getElementById('settings-modal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }
    function closeSettings() {
      const m = document.getElementById('settings-modal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    function saveApiUrl() {
      const val = document.getElementById('api-url-input').value.trim();
      if (val) {
        localStorage.setItem('apps_script_url', val);
        lastPayload = '';
        fetchLiveData(val);
        startPolling();
      } else {
        localStorage.removeItem('apps_script_url');
        clearInterval(pollTimer);
      }
      closeSettings();
    }
  </script>
</body>
</html>
